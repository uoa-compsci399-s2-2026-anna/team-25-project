services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccca
      POSTGRES_PASSWORD: ccca
      POSTGRES_DB: ccca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccca -d ccca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
