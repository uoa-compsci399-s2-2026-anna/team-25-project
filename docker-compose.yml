services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
      POSTGRES_DB: casa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casa -d casa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
