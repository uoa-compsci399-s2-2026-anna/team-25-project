name: Deploy

on:
  push:
    tags: ['v*']
  # To rerun a deploy, pick the tag in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Web
    if: startsWith(github.ref, 'refs/tags/v')
    # The run uses the workflow file from the tagged commit, which can remove the checks below. The AWS role
    # only trusts this environment, and the environment only allows v* tags, so other refs get no credentials.
    environment: production
    runs-on: ubuntu-latest
    env:
      DB_SECURITY_GROUP: ${{ vars.DB_SECURITY_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Anyone with write access can push a tag, so only deploy commits that main CI has passed.
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main."
            exit 1
          }

      - name: Check CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --workflow "CI Pipeline" --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$runs" = "0" ]; then
            echo "::error::CI Pipeline has not passed on main for $GITHUB_SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            node_modules
            */node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Deploy
        timeout-minutes: 30
        env:
          ECS_SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
        run: scripts/deploy.sh

      # deploy.sh closes its rule in a trap. This catches a run that was killed before the trap ran.
      # deploy.sh tags the rule cmo-deploy-<time>-<run id>, so match on the run id.
      - name: Remove the temporary database rule
        if: always() && steps.aws.outcome == 'success'
        run: |
          ids="$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$DB_SECURITY_GROUP" \
            --query "SecurityGroupRules[?Description && starts_with(Description, 'cmo-deploy-') && ends_with(Description, '-$GITHUB_RUN_ID')].SecurityGroupRuleId" --output text)"
          for id in $ids; do
            aws ec2 revoke-security-group-ingress --group-id "$DB_SECURITY_GROUP" --security-group-rule-ids "$id"
          done
